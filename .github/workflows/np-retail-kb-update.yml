name: NP Retail KB Update

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Update mode
        default: update
        options:
          - update
          - init
      module_filter:
        type: string
        description: Comma-separated kbDir filter (optional)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Run KB update
        shell: pwsh
        run: |
          ./scripts/np-retail-kb-update.ps1 `
            -NpRepoPath ${{ github.workspace }} `
            -Mode ${{ github.event.inputs.mode || 'update' }} `
            -ModuleFilter "${{ github.event.inputs.module_filter || '' }}"

      - name: Detect changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(kb): automated NP Retail KB update'
          title: 'NP Retail KB Update — ${{ github.event.inputs.mode || "update" }}'
          body: |
            ## Summary
            Automated update of NP Retail Knowledge Base from AL source.

            - **Mode:** ${{ github.event.inputs.mode || 'update' }}
            - **Trigger:** ${{ github.event_name }}

            ## What was generated
            - `api.md` files with parsed AL object references
            - `_object-registry.md` with updated Defines/Extends
            - `00-INDEX.md` tag matrices
            - `knowledge/_tags.md` (regenerated)

            ## Manual review needed
            - **overview.md** files are NOT generated by automation
            - **References** in `_object-registry.md` are preserved from previous curation
          branch: automated-kb-update
          base: ${{ github.ref_name }}
          labels: |
            automated
            kb-update
